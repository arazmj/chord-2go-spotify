[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chord-2go-spotify"
version = "0.1.0"
description = "Install Spotify Connect on a Chord 2go from macOS or Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arazmj" }]
keywords = ["chord", "2go", "spotify-connect", "librespot", "bluetooth"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["bleak==3.0.2"]

[project.urls]
Homepage = "https://github.com/arazmj/chord-2go-spotify"
Issues = "https://github.com/arazmj/chord-2go-spotify/issues"
Source = "https://github.com/arazmj/chord-2go-spotify"

[project.scripts]
chord-2go-spotify = "chord_2go_spotify.cli:main"

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chord_2go_spotify = ["data/*.tar.gz"]
