name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile Python
        run: python -m compileall -q src
      - name: Run tests
        run: python -m unittest discover -s tests -v

  public-tree:
    name: Check public tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check tracked files
        run: scripts/check-public-tree.sh
      - name: Check shell syntax
        run: |
          find payload scripts -type f -name '*.sh' -print0 |
            xargs -0 -n1 sh -n
